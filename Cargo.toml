[workspace]
resolver = "2"
members = ["crates/wave-proto", "crates/wavectl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wave-proto = { path = "crates/wave-proto" }
rusb = "0.9"
thiserror = "2"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
